name: Render and publish the tutorials

on:
  workflow_dispatch:
  push:
    branches: ['main']
    paths:
      - 'ws/**'

env:
  REGISTRY: ghcr.io

jobs:
  render-worksheets:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
      - name: Set IMAGE_NAME to lowercase
        run: echo "IMAGE_NAME=$(echo ${{ github.repository }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Pull Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Restore HTML cache
        uses: actions/cache@v4
        with:
          path: tmp-code
          key: qmd-cache-${{ hashFiles('.code/*.qmd') }}
          restore-keys: |
            qmd-cache-

      - name: Restore HTML files to .code directory
        run: |
          echo "Contents of the .code directory before copy"
          ls -la .code
          if [ -d tmp-code ]; then
            echo "Contents of the tmp-code directory"
            ls -la tmp-code
            cp -p tmp-code/*.html .code/
            echo "Contents of the .code directory after copy"
            ls -la .code
          else
            echo "No previously rendered HTML files found. Skipping restore."
          fi

      # Render worksheets
      - name: Make worksheets
        run: |
          mkdir ~/tmp
          Rscript -e "Sys.setenv(STANCFLAGS = '')"
          make -i ws_code

      # Copy html over to docs folder
      - name: Move htmls
        run: |
          mkdir -p docs
          cp .code/*.html docs

      - name: list the contents of .code directory
        run: |
          echo "Current dir: $(pwd)"
          ls -la .code
          ls -la
          ## apparently gh cant create an artifact out of a directory that starts with a .
          mkdir -p tmp-code
          cp -p .code/*.html tmp-code/
          ls -la tmp-code

      - name: Save HTML cache if it was not previously restored
        uses: actions/cache@v4
        #if: steps.html-cache.outputs.cache-hit != 'true'
        with:
          path: tmp-code
          key: qmd-cache-${{ hashFiles('.code/*.qmd') }}

