name: Render and publish the tutorials

on:
  workflow_dispatch:
  push:
    branches: ['CSE2025']
    paths:
      - 'tut/**'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository | lower }}

jobs:
  render-tutorials:
    runs-on: ubuntu-latest
    permissions:
      packages: read
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Log in to GitHub Container Registry
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ${{ env.REGISTRY }} -u ${{ github.actor }} --password-stdin

      - name: Pull Docker image
        run: docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest

      - name: Get last GitHub Pages deployment timestamp
        run: |
          RESPONSE=$(curl -s -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            "https://api.github.com/repos/${{ github.repository }}/pages/builds")
          
          # Check if response is an array and has elements
          if echo "$RESPONSE" | jq -e '.[0]' > /dev/null 2>&1; then
            DEPLOY_TIME_RAW=$(echo "$RESPONSE" | jq -r '.[0].updated_at')
            DEPLOY_TIME=$(date -d "$DEPLOY_TIME_RAW" +%s)
            echo "Last deployment: $DEPLOY_TIME_RAW ($DEPLOY_TIME)"
          else
            # No deployments yet, set to epoch (0) so all files are considered modified
            DEPLOY_TIME=0
            echo "No previous deployments found. Setting DEPLOY_TIME to 0 (all files will be rendered)"
          fi
          
          echo "DEPLOY_TIME=$DEPLOY_TIME" >> $GITHUB_ENV

      - name: Find modified .qmd files
        run: |
          git ls-tree -r --name-only origin/CSE2025 | grep 'tut/.*\.qmd$' | while read file; do
            MODIFIED_TIME_RAW=$(git log -1 --format="%ci" -- "$file")
            MODIFIED_TIME=$(date -d "$MODIFIED_TIME_RAW" +%s)
            echo "File: $file | Modified: $MODIFIED_TIME_RAW ($MODIFIED_TIME)"
            if [[ "$MODIFIED_TIME" > "$DEPLOY_TIME" ]]; then
              echo "$file was modified after last deployment."
              echo "$file" >> changed_files.txt
            fi
          done

          echo "Changed files:"
          cat changed_files.txt || echo "No changes found."

      - name: Pull Existing gh-pages Branch
        run: |
          # Try to clone the gh-pages branch; if it doesn't exist, create empty folder
          if git clone --branch gh-pages --single-branch https://github.com/${{ github.repository }} gh-pages-folder 2>/dev/null; then
            echo "Successfully cloned gh-pages branch"
            ls -lat gh-pages-folder
          else
            echo "gh-pages branch does not exist yet (first deployment). Creating empty folder."
            mkdir -p gh-pages-folder
          fi

          mkdir -p docs
          cp -r gh-pages-folder/*.html docs 2>/dev/null || echo "No existing HTML files to copy."

      - name: Render Updated Quarto Files
        run: |
          if [ -s changed_files.txt ]; then
            echo "Files to render:"
            cat changed_files.txt
            
            docker run --rm \
              -v ${{ github.workspace }}:/workspace \
              -w /workspace \
              ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest \
              bash -c "cat changed_files.txt | xargs -I {} quarto render {}"
            
            # Copy rendered files to docs folder
            cp tut/*.html docs/ 2>/dev/null || echo "No HTML files to copy."
          else
            echo "No updated files to render."
          fi

      - name: Configure git
        run: |
          git config --global user.name "pcinereus"
          git config --global user.email "i.obesulus@gmail.com"
          git config --global init.defaultBranch main

      - name: Deploy
        uses: JamesIves/github-pages-deploy-action@4.1.4
        with:
          branch: gh-pages
          folder: docs
